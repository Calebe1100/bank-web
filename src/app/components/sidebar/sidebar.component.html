<mat-sidenav-container class="sidenav-container" *ngIf="showHeader">
  <mat-sidenav #sidenav mode="side" [(opened)]="isExpanded" class="sidenav">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active">🏠 Home</a>
      <a mat-list-item routerLink="/account" routerLinkActive="active"
        >💼 Contas</a
      >
      <a mat-list-item routerLink="/withdraw" routerLinkActive="active"
        >💰 Sacar</a
      >
      <a mat-list-item routerLink="/deposit" routerLinkActive="active"
        >🏦 Depositar</a
      >
      <a mat-list-item routerLink="/extract" routerLinkActive="active"
        >🗒️ Extrato</a
      >
      <a mat-list-item (click)="OnLogout()">🚪 Sair</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="isExpanded = !isExpanded">
        <mat-icon>menu</mat-icon>
      </button>
      <mat-icon (click)="OnActionPage('home')" class="logo"
        >currency_exchange</mat-icon
      >
      OBANK
      <span class="spacer"></span>
      <span
        >Saldo:
        {{ totalSald | currency: "BRL" : "symbol" : "1.2-2" : "pt-BR" }}</span
      >

      <span class="spacer"></span>
      <span class="cliente"
        >Olá,
        <strong class="nome">{{
          name ? name.toUpperCase() : "Pessoa"
        }}</strong></span
      >

      <span class="spacer"></span>

      <div class="tax-container">
        <ng-container *ngFor="let taxa of taxas.slice(0, 3)">
          <span class="taxa">
            {{ taxa.nome.toUpperCase() }}:
            <strong>{{ taxa.valor | number: "1.2-2" }}%</strong>
          </span>
        </ng-container>
      </div>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<router-outlet *ngIf="!showHeader"></router-outlet>
